plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.voiceassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.voiceassistant"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Required to avoid duplicate .so file conflicts from MediaPipe / Vosk
    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    // Ensure large model files in assets are not compressed (speeds up loading)
    aaptOptions {
        noCompress "bin", "tflite", "task"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Kotlin Coroutines — all heavy work runs off the main thread
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Vosk offline STT (AAR + JNA bridge)
    // Place the AAR in app/libs/ if fetching from a local file,
    // or use the Maven coordinate below if your project's repositories include jitpack/alphacephei.
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // MediaPipe GenAI — on-device Gemma inference
    // Supports Gemma-2B / Phi-2 / Falcon-RW-1B; use a 270M-class GGUF via llama.cpp JNI
    // if you prefer: replace with your llama.cpp Android wrapper dependency instead.
    implementation 'com.google.mediapipe:tasks-genai:0.10.14'

    // llama.cpp JNI for GGUF model inference
    implementation 'io.github.kherud:llama:3.1.1'

    // JSON parsing for LLM structured output
    implementation 'org.json:json:20231013'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
